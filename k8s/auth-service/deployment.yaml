apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: devsecops-staging
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        # Seccomp profile enforcement
        seccomp.security.alpha.kubernetes.io/pod: "RuntimeDefault"
    spec:
      serviceAccountName: auth-service-sa
      containers:
      - name: auth-service
        image: gcr.io/PROJECT_ID/auth-service:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        securityContext:
          # Pod Security Standards (Restricted)
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "auth-secrets"
