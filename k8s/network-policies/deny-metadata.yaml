apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-metadata-server
  namespace: devsecops-staging
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # Allow all other egress (overridden by default-deny, but conceptually here to show what we block)
  # But explicitly block GCP Metadata Server
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32
