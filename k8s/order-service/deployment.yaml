apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: devsecops-staging
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        seccomp.security.alpha.kubernetes.io/pod: "RuntimeDefault"
    spec:
      serviceAccountName: order-service-sa
      containers:
      - name: order-service
        image: gcr.io/PROJECT_ID/order-service:latest
        ports:
        - containerPort: 8081
        env:
        - name: AUTH_SERVICE_URL
          value: "http://auth-service.devsecops-staging.svc.cluster.local:8080"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        securityContext:
          # Pod Security Standards (Restricted)
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "order-secrets"
